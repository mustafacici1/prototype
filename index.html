<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | StuntRacer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Landscape-only zorunluluk için viewport meta -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover,
                   orientation=landscape">

    <!-- Canvas’ın her zaman yatay doldurması için CSS -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #unity-container, #unity-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-width: 100vh;   /* Portrede genişliği dikey yüksekliğe sabitle */
        max-height: 100vw;  /* Portrede yüksekliği yatay genişliğe sabitle */
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">StuntRacer</div>
      </div>
    </div>

    <script>
      // Uyarı banner’ı gösterme fonksiyonu
      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        const div = document.createElement("div");
        div.innerHTML = msg;
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        warningBanner.appendChild(div);
        updateBannerVisibility();
      }

      // Mobilde portreyi tespit edip uyarı gösterme
      function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
          alert("Lütfen cihazınızı yatay (landscape) konuma çevirin!");
        }
      }
      window.addEventListener("load", checkOrientation);
      window.addEventListener("resize", checkOrientation);

      // Unity loader konfigürasyonu
      const buildUrl = "Build";
      const config = {
        dataUrl:    buildUrl + "/last.data",
        frameworkUrl: buildUrl + "/last.framework.js",
        codeUrl:    buildUrl + "/last.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:    "DefaultCompany",
        productName:    "StuntRacer",
        productVersion: "0.1",
        showBanner:     unityShowBanner,
      };
      const container       = document.querySelector("#unity-container");
      const canvas          = document.querySelector("#unity-canvas");
      const loadingBar      = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");

      // Cihaz tipi kontrolü (mobil vs. masaüstü)
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobilde tam ekrana yatay doldur
        canvas.className    = "unity-mobile";
        container.className = "unity-mobile";
      } else {
        // Masaüstünde sabit 960×600
        canvas.style.width  = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      // WebGL loader script’ini ekle
      const script = document.createElement("script");
      script.src   = buildUrl + "/last.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(unityInstance => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
        }).catch(err => {
          alert(err);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
